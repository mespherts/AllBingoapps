<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Service Directory</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="topbar__title-row">
      <h1 id="pageTitle" class="topbar__title">Service Directory</h1>
      <span class="topbar__count"><span id="resultCount">0</span> listed</span>
    </div>
    <p id="pageSubtitle" class="topbar__subtitle">Compare and find the right service, fast.</p>

    <div class="searchbar">
      <svg class="searchbar__icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
        <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <input id="searchInput" class="searchbar__input" type="text" inputmode="search"
             placeholder="Search by name…" autocomplete="off" />
      <button id="clearSearch" class="searchbar__clear" aria-label="Clear search" hidden>&times;</button>
    </div>

    <div id="tagRow" class="tagrow" role="tablist" aria-label="Filter by tag">
      <!-- tag chips injected by app.js -->
    </div>
  </header>

  <main id="list" class="list" aria-live="polite">
    <!-- rows injected by app.js -->
  </main>

  <div id="emptyState" class="empty" hidden>
    <p class="empty__title">Nothing matches</p>
    <p class="empty__sub">Try a different search term or clear filters.</p>
    <button id="resetFilters" class="empty__reset">Reset filters</button>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
